plugins:
- rubocop-md
- rubocop-prose
- rubocop-rake
- rubocop-rspec
- rubocop-spellcheck
- rubocop-yaml

inherit_from: ".rubocop_todo.yml"

AllCops:
  NewCops: enable
  Exclude:
  - vendor/**/*
  - gemfiles/vendor/**/*
  - coverage/**/*
  - pkg/**/*
  SuggestExtensions: false
  inherit_mode:
    merge:
    - Include
  Include:
  - ".github/**/*.yml"
  - ".rubocop.yml"

YAML/Lint/InvalidSyntax:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

YAML/Lint/DuplicateKey:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

Naming/FileName:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"
  - ".github/workflows/*.yml"
  - lib/mongoid-scroll.rb

Style/OneClassPerFile:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Prose/MaxLength:
  Max: false
  Exclude:
  - LICENSE.md

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"

Spellcheck/Spelling:
  Exclude:
  - LICENSE.md

Style/Documentation:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/UselessAssignment:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/MultilineBlockChain:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/SymbolProc:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/Void:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

# One release example verifies the tag, the next development commit, and their files together.
RSpec/MultipleExpectations:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - spec/release/release_spec.rb

RSpec/ExampleLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - spec/release/release_spec.rb

# Gemfile groups are declarative and grow with the dependency list.
Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - Gemfile
